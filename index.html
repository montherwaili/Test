<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محاكي اختبار القيادة - عُمان</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --border: rgba(11, 11, 11, 0.1);
        --accent: #2a78d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d0d0d;
          --surface: #1a1a19;
          --text: #f0efec;
          --text-2: #c3c2b7;
          --border: rgba(255, 255, 255, 0.1);
          --accent: #3987e5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 16px;
        padding: 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
      }
      p {
        color: var(--text-2);
        line-height: 1.7;
      }
      [lang='en'] {
        direction: ltr;
        text-align: left;
      }
      a {
        color: var(--accent);
      }
      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>محاكي اختبار القيادة - عُمان</h1>
      <p>
        المشروع قيد الإنشاء. المرحلة الأولى جاهزة: نموذج المحرك والقابض وناقل الحركة اليدوي.
        <br />
        <a href="./debug.html">افتح صفحة تجربة المحاكاة</a>
      </p>
      <hr />
      <div lang="en">
        <h1>Oman Driving Test Simulator</h1>
        <p>
          Under construction. Phase 1 is ready: the engine, clutch and manual gearbox model.
          <br />
          <a href="./debug.html">Open the simulation debug page</a>
        </p>
      </div>
    </main>
  </body>
</html>
